<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14532d">
<title>My Finance</title>
<style>
:root{--bg:#f6f7f4;--card:#fff;--ink:#1c2a22;--mut:#6b7a70;--g:#14532d;--cr:#15803d;--db:#b91c1c;--ln:#dfe4dc}
@media(prefers-color-scheme:dark){:root{--bg:#101612;--card:#1a221d;--ink:#e8efe9;--mut:#93a39a;--g:#4ade80;--cr:#4ade80;--db:#f87171;--ln:#2a352e}}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:70px}
header{background:var(--g);color:#fff;padding:14px 16px;font-size:18px;font-weight:700}
@media(prefers-color-scheme:dark){header{color:#06240f}}
main{padding:12px;max-width:640px;margin:auto}
.card{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:10px}
h3{margin:0 0 8px;font-size:15px}
input,select,button{font:inherit;padding:9px;border:1px solid var(--ln);border-radius:8px;background:var(--card);color:var(--ink);width:100%;margin:3px 0}
button{background:var(--g);color:#fff;border:0;font-weight:600;cursor:pointer}
@media(prefers-color-scheme:dark){button{color:#06240f}}
button.s{background:transparent;color:var(--g);border:1px solid var(--g)}
.row{display:flex;gap:8px}.row>*{flex:1}
.big{font-size:28px;font-weight:700}
.cr{color:var(--cr)}.db{color:var(--db)}.m{color:var(--mut);font-size:13px}
.t{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--ln)}
.t:last-child{border:0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--ln)}
nav button{background:none;color:var(--mut);border-radius:0;margin:0;padding:14px 4px}
nav button.on{color:var(--g);box-shadow:inset 0 3px var(--g)}
.bar{height:8px;background:var(--ln);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
.x{background:none;color:var(--db);width:auto;padding:0 6px}
</style></head><body>
<header>My Finance</header><main id="v"></main>
<nav id="n"></nav>
<script>
const MODES=['Cash','UPI','Debit Card','Credit Card','Net Banking','Cheque'];
let D;try{D=JSON.parse(localStorage.fin)}catch(e){}
D=D||{accounts:[{id:1,name:'Main Bank',open:0}],txns:[],loans:[]};
const $=s=>document.querySelector(s),uid=()=>Date.now()+Math.random(),inr=n=>'₹'+(+n).toLocaleString('en-IN',{maximumFractionDigits:2});
const today=()=>new Date().toISOString().slice(0,10);
function save(){localStorage.fin=JSON.stringify(D)}
let tab='home',F={from:'',to:'',q:''};
const tabs={home:'Home',txn:'Entries',loan:'Loans',rep:'Reports',set:'Sync'};
function bal(a){return +a.open+D.txns.filter(t=>t.acc==a.id).reduce((s,t)=>s+(t.type=='credit'?+t.amt:-t.amt),0)}
function go(t){tab=t;render()}
function render(){
$('#n').innerHTML=Object.entries(tabs).map(([k,v])=>`<button class="${k==tab?'on':''}" onclick="go('${k}')">${v}</button>`).join('');
$('#v').innerHTML=({home,txn,loan,rep,set})[tab]();}
function opts(){return D.accounts.map(a=>`<option value="${a.id}">${a.name}</option>`).join('')}
function home(){
const tot=D.accounts.reduce((s,a)=>s+bal(a),0),m=today().slice(0,7);
const mt=D.txns.filter(t=>t.date.startsWith(m)),c=mt.filter(t=>t.type=='credit').reduce((s,t)=>s+ +t.amt,0),d=mt.filter(t=>t.type=='debit').reduce((s,t)=>s+ +t.amt,0);
return `<div class="card"><div class="m">Total balance</div><div class="big">${inr(tot)}</div>
<div class="row"><div><span class="m">This month in</span><div class="cr">${inr(c)}</div></div><div><span class="m">This month out</span><div class="db">${inr(d)}</div></div></div></div>
<div class="card"><h3>Accounts</h3>${D.accounts.map(a=>`<div class="t"><span>${a.name}</span><b>${inr(bal(a))}</b></div>`).join('')}
<div class="row"><input id="an" placeholder="New account name"><input id="ao" type="number" placeholder="Opening balance"></div>
<button class="s" onclick="addAcc()">Add account</button></div>
<div class="card"><h3>Add entry</h3>
<select id="ty"><option value="debit">Debit (money out)</option><option value="credit">Credit (money in)</option></select>
<input id="am" type="number" placeholder="Amount"><div class="row"><input id="dt" type="date" value="${today()}"><select id="md">${MODES.map(x=>`<option>${x}</option>`)}</select></div>
<select id="ac">${opts()}</select><input id="nt" placeholder="Note (e.g. groceries, salary)">
<button onclick="addTxn()">Save entry</button></div>`}
function addAcc(){const n=$('#an').value.trim();if(!n)return;D.accounts.push({id:uid(),name:n,open:+$('#ao').value||0});save();render()}
function addTxn(){const a=+$('#am').value;if(!a)return alert('Enter an amount');
D.txns.push({id:uid(),type:$('#ty').value,amt:a,date:$('#dt').value,mode:$('#md').value,acc:$('#ac').value,note:$('#nt').value});save();render()}
function filt(){return D.txns.filter(t=>(!F.from||t.date>=F.from)&&(!F.to||t.date<=F.to)&&(!F.q||(t.note+t.mode).toLowerCase().includes(F.q.toLowerCase()))).sort((a,b)=>b.date.localeCompare(a.date))}
function txn(){const L=filt();return `<div class="card"><h3>Search entries</h3><div class="row"><input type="date" value="${F.from}" onchange="F.from=this.value;render()"><input type="date" value="${F.to}" onchange="F.to=this.value;render()"></div>
<input placeholder="Search note or mode" value="${F.q}" onchange="F.q=this.value;render()"><button class="s" onclick="F={from:'',to:'',q:''};render()">Clear</button></div>
<div class="card">${L.map(t=>`<div class="t"><span>${t.date}<br><span class="m">${t.mode} · ${(D.accounts.find(a=>a.id==t.acc)||{}).name||''} ${t.note?'· '+t.note:''}</span></span>
<span><b class="${t.type=='credit'?'cr':'db'}">${t.type=='credit'?'+':'-'}${inr(t.amt)}</b><button class="x" onclick="delTxn(${t.id})">✕</button></span></div>`).join('')||'<div class="m">No entries found.</div>'}</div>`}
function delTxn(id){if(confirm('Delete this entry?')){D.txns=D.txns.filter(t=>t.id!=id);save();render()}}
/* Reports */
function csv(from,to){const L=D.txns.filter(t=>t.date>=from&&t.date<=to).sort((a,b)=>a.date.localeCompare(b.date));
const r=[['Date','Type','Amount','Mode','Account','Note']].concat(L.map(t=>[t.date,t.type,t.amt,t.mode,(D.accounts.find(a=>a.id==t.acc)||{}).name,t.note]));
const ci=L.filter(t=>t.type=='credit').reduce((s,t)=>s+ +t.amt,0),co=L.filter(t=>t.type=='debit').reduce((s,t)=>s+ +t.amt,0);
r.push([],['Total credit','',ci],['Total debit','',co],['Net','',ci-co]);
dl(r.map(x=>x.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\n'),`report_${from}_to_${to}.csv`,'text/csv')}
function dl(txt,name,type){if(window.Android){Android.save(name,type,txt);return}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()}
function monthRep(off){const n=new Date(),s=new Date(n.getFullYear(),n.getMonth()+off,1),e=new Date(n.getFullYear(),n.getMonth()+off+1,0);
const f=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);csv(f(s),f(e))}
function rep(){return `<div class="card"><h3>Monthly report</h3><button onclick="monthRep(0)">Download this month</button><button class="s" onclick="monthRep(-1)">Download last month</button></div>
<div class="card"><h3>Custom date range</h3><div class="row"><input id="rf" type="date"><input id="rt" type="date" value="${today()}"></div>
<button onclick="$('#rf').value?csv($('#rf').value,$('#rt').value):alert('Pick a start date')">Download report (CSV)</button>
<div class="m">CSV opens in Excel / Google Sheets.</div></div>`}
/* Loans */
function emiCalc(P,R,N){const r=R/1200;return r?P*r*Math.pow(1+r,N)/(Math.pow(1+r,N)-1):P/N}
function outst(l,k){const r=l.rate/1200;return r?Math.max(0,l.P*Math.pow(1+r,k)-l.emi*(Math.pow(1+r,k)-1)/r):l.P-l.emi*k}
function addMonths(d,n){const x=new Date(d);x.setMonth(x.getMonth()+n);return x.toISOString().slice(0,10)}
function loan(){return D.loans.map(l=>{const k=l.paid.length,left=outst(l,k);return `<div class="card"><h3>${l.name} <span class="m">${l.lender}</span></h3>
<div class="row"><div><span class="m">EMI</span><div><b>${inr(l.emi)}</b></div></div><div><span class="m">Outstanding</span><div><b class="db">${inr(left)}</b></div></div></div>
<div class="m" style="margin:6px 0">${k} of ${l.n} EMIs paid · ${l.rate}% p.a. · Principal ${inr(l.P)}</div>
<div class="bar"><i style="width:${k/l.n*100}%"></i></div>
<div class="m" style="margin:6px 0">${k<l.n?'Next due: '+addMonths(l.start,k):'Loan closed 🎉'}</div>
${k<l.n?`<button onclick="payEmi(${l.id})">Mark EMI paid</button>`:''}
<details><summary class="m">Payment history</summary>${l.paid.map((d,i)=>`<div class="t"><span>EMI ${i+1}</span><span>${d}</span></div>`).join('')||'<div class="m">None yet</div>'}</details>
<button class="s" onclick="delLoan(${l.id})">Delete loan</button></div>`}).join('')+
`<div class="card"><h3>Add loan</h3><input id="ln" placeholder="Loan name (Home, Car…)"><input id="ll" placeholder="Lender / bank">
<div class="row"><input id="lp" type="number" placeholder="Principal"><input id="lr" type="number" step="0.01" placeholder="Rate % p.a."></div>
<div class="row"><input id="lt" type="number" placeholder="Tenure (months)"><input id="ls" type="date" value="${today()}"></div>
<div class="m">First EMI date</div><button onclick="addLoan()">Save loan</button></div>`}
function addLoan(){const P=+$('#lp').value,R=+$('#lr').value,N=+$('#lt').value;if(!P||!N||!$('#ln').value)return alert('Fill name, principal and tenure');
D.loans.push({id:uid(),name:$('#ln').value,lender:$('#ll').value,P,rate:R,n:N,start:$('#ls').value,emi:Math.round(emiCalc(P,R,N)*100)/100,paid:[]});save();render()}
function payEmi(id){const l=D.loans.find(x=>x.id==id);l.paid.push(today());
if(confirm('Also record this EMI as a debit entry?'))D.txns.push({id:uid(),type:'debit',amt:l.emi,date:today(),mode:'Net Banking',acc:D.accounts[0].id,note:'EMI - '+l.name});save();render()}
function delLoan(id){if(confirm('Delete this loan?')){D.loans=D.loans.filter(l=>l.id!=id);save();render()}}
/* Drive sync (app-private folder) */
let tok;
function auth(cb){const id=localStorage.cid;if(!id)return alert('Enter your Google Client ID first');
if(!window.google)return alert('Google script not loaded. Check internet.');
google.accounts.oauth2.initTokenClient({client_id:id,scope:'https://www.googleapis.com/auth/drive.appdata',callback:r=>{if(r.access_token){tok=r.access_token;cb()}}}).requestAccessToken()}
async function find(){const r=await fetch("https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name%3D'finance.json'&fields=files(id)",{headers:{Authorization:'Bearer '+tok}});return (await r.json()).files[0]}
function up(){auth(async()=>{const f=await find(),h={Authorization:'Bearer '+tok};let r;
if(f)r=await fetch(`https://www.googleapis.com/upload/drive/v3/files/${f.id}?uploadType=media`,{method:'PATCH',headers:h,body:JSON.stringify(D)});
else{const b=new FormData();b.append('metadata',new Blob([JSON.stringify({name:'finance.json',parents:['appDataFolder']})],{type:'application/json'}));b.append('file',new Blob([JSON.stringify(D)],{type:'application/json'}));
r=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:h,body:b})}
alert(r.ok?'Backed up to Google Drive':'Backup failed')})}
function down(){auth(async()=>{const f=await find();if(!f)return alert('No backup found in Drive');
if(!confirm('Replace data on this device with the Drive backup?'))return;
D=await (await fetch(`https://www.googleapis.com/drive/v3/files/${f.id}?alt=media`,{headers:{Authorization:'Bearer '+tok}})).json();save();render();alert('Restored')})}
function set(){return `<div class="card"><h3>Google Drive sync</h3><input id="ci" placeholder="Google OAuth Client ID" value="${localStorage.cid||''}" onchange="localStorage.cid=this.value.trim()">
<button onclick="up()">Back up to Drive</button><button class="s" onclick="down()">Restore from Drive</button>
<div class="m">Data is stored in your app-private Drive folder. It also stays saved on this device.</div></div>
<div class="card"><h3>Local backup</h3><button class="s" onclick="dl(JSON.stringify(D),'finance-backup.json','application/json')">Download JSON backup</button></div>`}
function set(){return `<div class="card"><h3>Back up to Google Drive</h3>
<button onclick="Android.share('finance-backup.json',JSON.stringify(D))">Share backup → choose Drive</button>
<div class="m">Pick "Save to Drive" in the share sheet. Your data is also auto-backed up by Android to your Google account.</div></div>
<div class="card"><h3>Restore</h3><input type="file" accept=".json,application/json" onchange="restore(this)">
<div class="m">Choose a finance-backup.json file (from Drive or Downloads).</div></div>
<div class="card"><h3>Save backup to Downloads</h3><button class="s" onclick="dl(JSON.stringify(D),'finance-backup.json','application/json')">Download JSON backup</button></div>`}
function restore(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.txns)throw 0;if(confirm('Replace current data with this backup?')){D=d;save();render()}}catch(e){alert('Not a valid backup file')}};r.readAsText(f)}
render();
</script></body></html>
